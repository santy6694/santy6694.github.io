---
layout: default
---
<div id="post" class="section wb" style="padding-top: 160px;">
    <div class="container">
        <div class="row">
            <div class="col-md-8 offset-md-2">
                <article class="post-box single-post">
                    {% if page.image %}
                    <div class="post-thumb">
                        <img src="{{ page.image | relative_url }}" class="img-fluid" alt="{{ page.title }}" />
                    </div>
                    {% endif %}
                    <div class="post-info">
                        <h1>{{ page.title }}</h1>
                        <ul>
                            <li>by {{ page.author | default: site.author }}</li>
                            <li>{{ page.date | date: "%b %-d, %Y" }}</li>
                            {% if page.tags %}<li>{{ page.tags | join: ", " }}</li>{% endif %}
                        </ul>
                        <div class="post-content">
                            {{ content }}
                        </div>
                        <p><a href="{{ '/#blog' | relative_url }}" class="sim-btn btn-hover-new" data-text="Back to Blog"><span>Back to Blog</span></a></p>
                    </div>
                </article>
            </div>
        </div>
    </div>
</div>
